<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Scramjet App</title>
		<link rel="stylesheet" href="/styles.css" />
		<meta name="robots" content="noindex" />
	</head>

	<body>
		<div class="toolbar">
			<div class="toolbar__left">
				<button id="back" type="button" aria-label="Back" title="Back">
					&lt;
				</button>
				<button
					id="forward"
					type="button"
					aria-label="Forward"
					title="Forward"
				>
					&gt;
				</button>
				<button id="reload" type="button">reload</button>
			</div>

			<form id="omnibox" class="omnibox" role="search">
				<input
					id="address"
					type="text"
					name="address"
					placeholder="search or enter address"
					autocomplete="off"
					autocapitalize="off"
					spellcheck="false"
					enterkeyhint="go"
					aria-label="Address"
				/>
			</form>

		</div>

		<p id="status" class="status" role="status" hidden></p>

		<main id="frames" class="frames"></main>

		<script type="module" src="/js/app.js"></script>
	<script>
window.addEventListener("message", function(event) {
  if (event.source !== window.parent) return;

 <script>
window.addEventListener("message", function(event) {
  if (event.source !== window.parent) return;

  const data = event.data;
  if (!data || data.source !== "PROJECT_REBELLION") return;
  if (data.type !== "navigate") return;
  if (typeof data.url !== "string") return;
  if (!/^https?:\/\//i.test(data.url)) return;

  const addressInput = document.querySelector("input");
  if (!addressInput) return;

  const valueSetter = Object.getOwnPropertyDescriptor(
    HTMLInputElement.prototype,
    "value"
  ).set;

  valueSetter.call(addressInput, data.url);
  addressInput.dispatchEvent(
    new Event("input", { bubbles: true })
  );

  addressInput.dispatchEvent(
    new KeyboardEvent("keydown", {
      key: "Enter",
      code: "Enter",
      keyCode: 13,
      which: 13,
      bubbles: true
    })
  );
});
</script>
	</body>
</html>
